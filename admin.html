<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoro Jobs — Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./app.css">
<meta name="theme-color" content="#0F3D3A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
</head>
<body>
<div class="app wide" id="app">
<section class="screen on" id="s-login" style="background:#F1F4F3;align-items:center;justify-content:center">
  <div class="card" style="width:100%;max-width:400px;padding:28px">
    <div class="row" style="margin-bottom:18px"><div style="width:34px;height:34px;border-radius:9px;background:#0F3D3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">Y</div><b style="font-size:18px">Yoro Jobs Admin</b></div>
    <label class="lbl" for="email">Work email</label><input class="inp" id="email" type="email" autocomplete="username">
    <label class="lbl" for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="margin-top:20px">Log in</button>
    <div class="note" style="margin-top:12px">Staff accounts are created by YORO admin. <a href="./index.html">Candidate app →</a></div>
  </div>
</section>

<section class="screen" id="s-admin">
  <div class="top"><b style="margin-right:8px">Yoro Jobs Admin</b><a href="#dash" data-a="dash">Dashboard</a><a href="#cands" data-a="cands">Candidates</a><a href="#nearby" data-a="nearby">Nearby search</a><a href="#jobs" data-a="jobs">Jobs</a><a href="#queue" data-a="queue">Verification queue</a><a href="#bulk" data-a="bulk">📣 WhatsApp</a><a href="./index.html" id="toCand" style="margin-left:auto;background:rgba(255,255,255,.12)">📱 Candidate view</a><span class="note" style="color:#fff;opacity:.75" id="who"></span><button class="btn sm ghost" id="logout" style="height:30px;font-size:12px">Log out</button></div>
  <div class="main" id="main"></div>
</section>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { setMode, cities, areasIn, sb, $, esc, toast, openSheet, closeSheet, initModal, chipRow, chipVal, fmtDate, initials, strength, areas, signedUrl, drawIdCard, uploadDoc, pay, shortId } from './shared.js';
import { SKILLS } from './config.js';
initModal();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
$('toCand').onclick = () => setMode('candidate');
let user = null, AREAS = [], CITIES = [], tab = 'dash', st = { q: '', stage: '', role: '', city: '', verified: false, ncity: 'Pune', nearArea: 'Magarpatta', radius: 5, nrole: '', nver: false, navail: true, jcity: '', staff: '' };
const staffTag = (c) => (c.is_yoro_staff ? ' <span class="tag" style="background:#E0E7FF;color:#3730A3">YORO staff</span>' : '');
const cityOpts = (sel, allLabel) => (allLabel ? `<option value="">${allLabel}</option>` : '') + CITIES.map((c) => `<option value="${esc(c.name)}" ${c.name === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
const areaList = (city) => areasIn(city, AREAS, CITIES);
const areaOpts = (city, sel) => { const l = areaList(city); return (sel && !l.some((a) => a.name === sel) ? `<option selected>${esc(sel)}</option>` : '') + l.map((a) => `<option ${a.name === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join(''); };

// ---------- auth ----------
$('loginBtn').onclick = async () => { $('loginErr').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value }); if (error) $('loginErr').textContent = error.message; };
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logout').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((ev, s) => { user = s?.user || null; boot(); });
async function boot() {
  const { data: { session } } = await sb.auth.getSession(); user = session?.user || null;
  if (!user) { $('s-login').classList.add('on'); $('s-admin').classList.remove('on'); return; }
  const { data: isAdmin } = await sb.rpc('is_admin');
  if (!isAdmin) { $('loginErr').textContent = 'This account is not on the admin list. Ask Sahil to add your email in the admins table.'; await sb.auth.signOut(); return; }
  setMode('admin'); [AREAS, CITIES] = await Promise.all([areas(), cities()]); $('who').textContent = user.email; $('s-login').classList.remove('on'); $('s-admin').classList.add('on'); route();
}
window.addEventListener('hashchange', () => { closeSheet(); route(); });
function route() { if (!user) return; tab = (location.hash || '#dash').slice(1); document.querySelectorAll('.top a').forEach((a) => a.classList.toggle('on', a.dataset.a === tab)); ({ dash, cands, nearby, jobs, queue, bulk }[tab] || dash)(); }
boot();

const stageTag = (s) => { const m = { New: 't-new', Contacted: 't-mute', 'Docs pending': 't-mute', 'In verification': 't-warn', Verified: 't-ok', Placed: 't-ok', Blacklisted: 't-bad', Rejected: 't-bad', Dormant: 't-mute' }; return `<span class="tag ${m[s] || 't-mute'}">${esc(s)}</span>`; };
const vtick = (c) => c.verified ? '<span class="tick">🛡 Verified</span>' : '<span class="note">—</span>';
const M = $('main');

// ---------- dashboard ----------
async function dash() {
  M.innerHTML = '<div class="note">Loading…</div>';
  const { data: s } = await sb.rpc('admin_stats'); const x = s || {};
  const { data: recent } = await sb.from('candidates').select('id,name,phone,role,area,city,stage,verified,created_at').order('created_at', { ascending: false }).limit(8);
  const { data: allc } = await sb.from('candidates').select('city').limit(10000); const byCity = {}; (allc || []).forEach((r) => (byCity[r.city] = (byCity[r.city] || 0) + 1));
  const cityChips = Object.entries(byCity).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<a href="#cands" class="chip" data-gocity="${esc(c)}" style="text-decoration:none">${esc(c)} <b>${n}</b></a>`).join('') || '<span class="note">No candidates yet</span>';
  M.innerHTML = `<h1>Dashboard</h1><div class="stats"><div class="stat"><b>TOTAL CANDIDATES</b><span>${x.total ?? 0}</span><div class="note">${x.new_this_week ?? 0} this week</div></div><div class="stat"><b>NEW · NOT CALLED</b><span>${x.new ?? 0}</span></div><div class="stat"><b>IN VERIFICATION</b><span>${x.in_verification ?? 0}</span></div><div class="stat"><b>DOCS TO REVIEW</b><span>${x.docs_to_review ?? 0}</span></div><div class="stat" style="border-color:#15803D"><b style="color:#15803D">VERIFIED</b><span style="color:#15803D">${x.verified ?? 0}</span><div class="note">${x.available_verified ?? 0} available now</div></div><div class="stat"><b>OPEN JOBS</b><span>${x.open_jobs ?? 0}</span></div></div>
  <h2>Candidates by city</h2><div class="chips" style="margin-bottom:18px">${cityChips}</div><h2>Latest registrations</h2><div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>City</th><th>Area</th><th>Stage</th><th>Verified</th><th>Registered</th><th></th></tr></thead><tbody>${(recent || []).map((c) => `<tr><td><b>${esc(c.name)}</b><div class="note">${esc(c.phone)}</div></td><td>${esc(c.role)}</td><td>${esc(c.city)}</td><td>${esc(c.area)}</td><td>${stageTag(c.stage)}</td><td>${vtick(c)}</td><td class="note">${new Date(c.created_at).toLocaleString('en-IN')}</td><td><button class="btn sm" data-cand="${c.id}">Open</button></td></tr>`).join('') || '<tr><td colspan="7" class="note" style="text-align:center;padding:24px">No registrations yet.</td></tr>'}</tbody></table></div>`;
}

// ---------- candidates ----------
async function cands() {
  let q = sb.from('candidates').select('id,name,phone,role,area,city,stage,verified,available,prefs,exp,photo_path,created_at,is_yoro_staff').order('created_at', { ascending: false }).limit(200);
  if (st.city) q = q.eq('city', st.city); if (st.staff) q = q.eq('is_yoro_staff', st.staff === 'yes'); if (st.stage) q = q.eq('stage', st.stage); if (st.role) q = q.eq('role', st.role); if (st.verified) q = q.eq('verified', true);
  if (st.q) q = q.or(`name.ilike.%${st.q}%,phone.ilike.%${st.q}%,area.ilike.%${st.q}%`);
  const { data: rows } = await q;
  M.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px"><h1 style="margin:0">Candidates</h1><div class="row"><button class="btn sm ghost" id="csv">Export CSV</button><button class="btn sm" id="addCand">+ Add candidate (walk-in)</button></div></div>
  <div class="filters"><input class="inp" id="fq" placeholder="Search name / phone / area" value="${esc(st.q)}"><select class="inp" id="fc">${cityOpts(st.city, 'City: All')}</select><select class="inp" id="fst"><option value="">YORO staff: All</option><option value="yes" ${st.staff === 'yes' ? 'selected' : ''}>Existing YORO staff</option><option value="no" ${st.staff === 'no' ? 'selected' : ''}>Not YORO staff</option></select><select class="inp" id="fs"><option value="">Stage: All</option>${['New', 'Contacted', 'Docs pending', 'In verification', 'Verified', 'Placed', 'Dormant', 'Blacklisted'].map((s) => `<option ${st.stage === s ? 'selected' : ''}>${s}</option>`).join('')}</select><select class="inp" id="fr"><option value="">Role: All</option>${['Caregiver', 'Nurse', 'Physio'].map((s) => `<option ${st.role === s ? 'selected' : ''}>${s}</option>`).join('')}</select><button class="chip ${st.verified ? 'on' : ''}" id="fv">Verified only</button><span class="note">${(rows || []).length} shown</span></div>
  <div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>City</th><th>Area</th><th>Stage</th><th>Verified</th><th>Pref</th><th>Exp</th><th>Available</th><th>Registered</th><th></th></tr></thead><tbody>${(rows || []).map((c) => `<tr><td><b>${esc(c.name)}</b>${staffTag(c)}<div class="note">${esc(c.phone)}</div></td><td>${esc(c.role)}</td><td>${esc(c.city)}</td><td>${esc(c.area)}</td><td>${stageTag(c.stage)}</td><td>${vtick(c)}</td><td>${c.prefs ? esc(c.prefs.shift + ' · ' + c.prefs.type) : '<span class="note">—</span>'}</td><td>${c.exp ? c.exp.years + ' yrs' : '<span class="note">—</span>'}</td><td>${c.available ? '<span class="ok">Yes</span>' : 'No'}</td><td class="note">${fmtDate(c.created_at)}</td><td><button class="btn sm" data-cand="${c.id}">Open</button></td></tr>`).join('') || '<tr><td colspan="11" class="note" style="text-align:center;padding:24px">No candidates match.</td></tr>'}</tbody></table></div>`;
  $('fq').oninput = (e) => { st.q = e.target.value.trim(); clearTimeout(window._ft); window._ft = setTimeout(cands, 300); }; $('fs').onchange = (e) => { st.stage = e.target.value; cands(); }; $('fc').onchange = (e) => { st.city = e.target.value; cands(); }; $('fst').onchange = (e) => { st.staff = e.target.value; cands(); }; $('fr').onchange = (e) => { st.role = e.target.value; cands(); }; $('fv').onclick = () => { st.verified = !st.verified; cands(); };
  $('csv').onclick = () => { const h = ['name', 'phone', 'yoro_staff', 'role', 'city', 'area', 'stage', 'verified', 'available', 'shift', 'type', 'years', 'registered']; const lines = [h.join(',')].concat((rows || []).map((c) => [c.name, c.phone, c.is_yoro_staff ? 'yes' : 'no', c.role, c.city, c.area, c.stage, c.verified, c.available, c.prefs?.shift || '', c.prefs?.type || '', c.exp?.years ?? '', c.created_at.slice(0, 10)].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'yoro-candidates.csv'; a.click(); };
  $('addCand').onclick = () => { openSheet(`<h2>Add candidate (walk-in / referral)</h2><p class="sub">Creates a login for their phone number. They log in with the phone number and this PIN.</p><label class="lbl">Name</label><input class="inp" id="wn"><label class="lbl">Phone (10 digits)</label><input class="inp" id="wp" maxlength="10"><label class="lbl">Login PIN (4 digits — tell the candidate)</label><input class="inp" id="wpin" maxlength="4" value="1234"><span class="lbl">Role</span>${chipRow('role', ['Caregiver', 'Nurse', 'Physio'], 'Caregiver')}<span class="lbl">Existing YORO employee?</span>${chipRow('ystaff', ['No', 'Yes'], 'No')}<div class="grid2"><div><label class="lbl">City</label><select class="inp" id="wc">${cityOpts(st.city || 'Pune')}</select></div><div><label class="lbl">Area</label><select class="inp" id="wa">${areaOpts(st.city || 'Pune')}</select></div></div><div class="err" id="werr"></div><button class="btn" id="wsave" style="margin-top:20px">Add</button>`); $('wc').onchange = () => { $('wa').innerHTML = areaOpts($('wc').value); }; $('wsave').onclick = async () => { const p = $('wp').value.replace(/\D/g, ''), n = $('wn').value.trim(); const wa = areaList($('wc').value).find((x) => x.name === $('wa').value); if (p.length !== 10 || !n) return ($('werr').textContent = 'Name and 10-digit phone needed'); $('wsave').disabled = true; const { data, error } = await sb.functions.invoke('admin-add-candidate', { body: { phone: p, pin: $('wpin').value.replace(/\D/g, ''), name: n, role: chipVal('role'), area: wa.name, city: wa.city, lat: wa.lat, lng: wa.lng, is_yoro_staff: chipVal('ystaff') === 'Yes' } }); $('wsave').disabled = false; if (error || data?.error) return ($('werr').textContent = data?.error || error.message); closeSheet(); toast('Added'); cands(); }; };
}

// ---------- candidate detail ----------
document.addEventListener('click', (e) => { const gc = e.target.closest('[data-gocity]'); if (gc) { st.city = gc.dataset.gocity; } const b = e.target.closest('[data-cand]'); if (b) openCand(b.dataset.cand); const j = e.target.closest('[data-job]'); if (j) openJob(Number(j.dataset.job)); const je = e.target.closest('[data-jedit]'); if (je) editJob(Number(je.dataset.jedit)); });
async function openCand(id) {
  const [{ data: c }, { data: docsArr }, { data: notes }, { data: ints }] = await Promise.all([
    sb.from('candidates').select('*').eq('id', id).single(),
    sb.from('documents').select('*').eq('candidate_id', id),
    sb.from('candidate_notes').select('*').eq('candidate_id', id).order('created_at', { ascending: false }).limit(20),
    sb.from('job_interests').select('status,created_at,jobs(id,role,area,shift,start_date)').eq('candidate_id', id)]);
  if (!c) return;
  const docs = {}; (docsArr || []).forEach((d) => (docs[d.slot] = d)); const ch = c.checks || {};
  const need = c.role === 'Caregiver' ? ['id', 'bgv'] : ['id', 'cert', 'bgv'];
  const chk = (k, t, n, req) => `<label class="check"><input type="checkbox" data-chk="${k}" ${ch[k] ? 'checked' : ''}><span><b>${t}</b>${req ? ' <span style="color:#B91C1C;font-size:11px;font-weight:700">REQUIRED</span>' : ''}<div class="note">${n}</div></span></label>`;
  const docRow = (k, t, adminOnly) => { const f = docs[k]; return `<div class="row" style="padding:8px 0;border-bottom:1px solid #EEF2F1"><div class="docthumb" data-thumb="${k}"></div><div class="grow"><b style="font-size:13px">${t}</b><div class="note">${f ? `${esc(f.file_name || f.file_path)} · ${fmtDate(f.created_at)}${f.rejection_reason ? ' · <span style="color:#B91C1C">' + esc(f.rejection_reason) + '</span>' : ''}` : 'not uploaded'}</div></div>${f ? `<span class="tag ${['Verified', 'Cleared'].includes(f.status) ? 't-ok' : ['Rejected', 'Failed'].includes(f.status) ? 't-bad' : 't-warn'}">${esc(f.status).toUpperCase()}</span><button class="btn sm ghost" data-view="${k}">View</button><button class="btn sm ghost" data-docok="${k}">Verify</button><button class="btn sm danger" data-docno="${k}">Reject</button>` : `<label class="btn sm ghost" style="cursor:pointer">Upload<input type="file" accept="image/*,.pdf" data-up="${k}" style="display:none"></label>`}</div>`; };
  openSheet(`<div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row"><div class="avatar" id="cAv" style="width:64px;height:64px;background:#E6F4F2;font-size:22px">${initials(c.name)}</div><div><h2>${esc(c.name)}${staffTag(c)} ${c.verified ? '<span class="tick">🛡 YORO Verified</span>' : '<span class="tag t-warn">NOT VERIFIED</span>'}</h2><div class="note">${esc(c.role)} · ${esc(c.area)}, ${esc(c.city)} · <a href="tel:+91${c.phone}">${esc(c.phone)}</a> · <a href="https://wa.me/91${c.phone}" target="_blank" rel="noopener">WhatsApp</a> · ${stageTag(c.stage)} · ${c.available ? '<span class="ok">available</span>' : 'not available'} · ID ${shortId(c.id)}</div></div></div><button class="btn sm ghost" id="closeSheet">Close</button></div>
  <div class="grid2" style="margin:14px 0;gap:16px;grid-template-columns:1fr 1fr">
  <div><b>Profile</b> <span class="note">(${strength(c, docs)}%)</span><div class="note" style="margin-top:6px;line-height:1.7">Preference: ${c.prefs ? esc(`${c.prefs.type} · ${c.prefs.shift} · ${c.prefs.timing || 'any'} · ${c.prefs.radius} km`) : '—'}<br>Experience: ${c.exp ? esc(`${c.exp.years} yrs · ${(c.exp.skills || []).join(', ') || '—'} · ${c.exp.employer || ''}`) : '—'}${c.exp?.reg ? `<br>Registration: ${esc(c.exp.qual || '')} · ${esc(c.exp.reg)}` : ''}<br>Personal: ${c.personal ? esc(`${c.personal.gender || ''} · ${(c.personal.langs || []).join(', ')} · ${c.personal.dob || ''} · ${c.personal.address || ''}`) : '—'}<br>Expected: ${c.exp?.salary ? '₹' + c.exp.salary + '/mo' : '—'}<br>Registered ${new Date(c.created_at).toLocaleString('en-IN')}${c.referral_source ? ' · via ' + esc(c.referral_source) : ''}</div>
  <div style="margin-top:10px"><b>Jobs</b><div class="note">${(ints || []).map((i) => `${esc(i.jobs?.role || '')} · ${esc(i.jobs?.area || '')} · ${esc(i.jobs?.shift || '')} — <b>${esc(i.status)}</b>`).join('<br>') || 'no interests yet'}</div></div>
  <div style="margin-top:10px"><b>Location</b> <select class="inp" id="locCity" style="height:36px;width:auto;font-size:13px">${cityOpts(c.city)}</select> <select class="inp" id="locArea" style="height:36px;width:auto;font-size:13px">${areaOpts(c.city, c.area)}</select> <button class="btn sm ghost" id="locSave">Save location</button></div>
  <div style="margin-top:10px"><b>Stage</b> <select class="inp" id="stageSel" style="height:36px;width:auto;font-size:13px">${['New', 'Contacted', 'Docs pending', 'In verification', 'Verified', 'Placed', 'Dormant', 'Rejected', 'Blacklisted'].map((s) => `<option ${c.stage === s ? 'selected' : ''}>${s}</option>`).join('')}</select> <button class="btn sm ghost" id="availBtn">${c.available ? 'Mark unavailable' : 'Mark available'}</button> <button class="btn sm ghost" id="staffBtn">${c.is_yoro_staff ? 'Not a YORO employee' : 'Mark as YORO employee'}</button></div>
  <div style="margin-top:12px"><b>Call log &amp; notes</b><div class="row" style="margin-top:6px;flex-wrap:wrap"><select class="inp" id="callOut" style="height:36px;width:auto;font-size:13px"><option>Reached</option><option>No answer</option><option>Call back</option><option>Not interested</option></select><input class="inp" id="noteBody" placeholder="Notes from the call…" style="height:36px;font-size:13px;flex:1 1 200px"><button class="btn sm" id="logCall">Log call</button><button class="btn sm ghost" id="addNote">Add note</button></div><div class="note" style="margin-top:8px;line-height:1.6;max-height:160px;overflow-y:auto">${(notes || []).map((n) => `<div><b>${esc(n.kind === 'call' ? '📞 ' + (n.outcome || '') : '📝')}</b> ${esc(n.body || '')} <span style="opacity:.7">— ${esc(n.author || '')}, ${new Date(n.created_at).toLocaleString('en-IN')}</span></div>`).join('') || 'No calls logged yet.'}</div></div></div>
  <div><b>Verification checklist</b><div style="margin-top:8px">${chk('photo', 'Photo matches ID', 'Visual check')}${chk('id', 'Identity document verified', 'Aadhaar / PAN / Passport', true)}${c.role !== 'Caregiver' ? chk('cert', 'Registration certificate verified', 'Checked against council register', true) : ''}${chk('bgv', 'Background verification cleared', 'Police verification / vendor report', true)}${chk('ref', 'Reference check', 'Optional')}</div>
  <div class="card" style="margin-top:8px;border:2px dashed ${c.verified ? '#15803D' : '#CFD8D6'}"><b style="color:${c.verified ? '#15803D' : '#5B6565'}">Verified tick: ${c.verified ? 'ON' : 'OFF'}</b><div class="note">Turns on automatically when ${need.join(' + ').toUpperCase()} are all ticked.${c.verified_at ? ' Verified ' + new Date(c.verified_at).toLocaleDateString('en-IN') + ' by ' + esc(c.verified_by || '') : ''}</div></div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="idcard">🪪 Generate ID card</button><button class="btn sm ghost" id="resetPin">Reset login PIN</button><button class="btn sm danger" id="blk">${c.stage === 'Blacklisted' ? 'Remove from blacklist' : 'Blacklist'}</button></div></div></div>
  <b>Document drive</b><div class="note">candidate-docs/${c.id}/ · private bucket · signed links expire in 10 min</div>
  <div style="margin-top:6px">${docRow('photo', 'Photo')}${docRow('id', 'Identity proof (Aadhaar / PAN / Passport)')}${docRow('cert', c.role !== 'Caregiver' ? 'Registration certificate' : 'Training certificate')}${docRow('qual', 'Qualification certificate')}${docRow('addr', 'Address proof')}${docRow('bgv', 'BGV / police verification report (verifier upload)', true)}${docRow('agreement', 'Signed agreement (verifier upload)', true)}</div>
  <div id="viewer" style="margin-top:12px"></div>`);
  $('closeSheet').onclick = closeSheet;
  // thumbs
  if (c.photo_path) { const u = await signedUrl(c.photo_path); if (u) $('cAv').innerHTML = `<img src="${u}" alt="">`; }
  for (const k of Object.keys(docs)) { const el = $('sheet').querySelector(`[data-thumb="${k}"]`); if (el && docs[k].file_path.endsWith('.jpg')) { const u = await signedUrl(docs[k].file_path); if (u) el.outerHTML = `<img class="docthumb" src="${u}" alt="">`; } }

async function bulkAudience() {
  const f = st.bulk || {};
  let q = sb.from('candidates').select('id,name,phone,city,area,role,stage,verified,available,is_yoro_staff').neq('stage', 'Blacklisted').order('name').limit(5000);
  if (f.city) q = q.eq('city', f.city); if (f.role) q = q.eq('role', f.role); if (f.stage) q = q.eq('stage', f.stage);
  if (f.staff === 'yes') q = q.eq('is_yoro_staff', true); if (f.staff === 'no') q = q.eq('is_yoro_staff', false);
  if (f.verified) q = q.eq('verified', true); if (f.avail) q = q.eq('available', true);
  const { data } = await q; return data || [];
}
async function bulk() {
  st.bulk = st.bulk || { city: '', role: '', stage: '', staff: '', verified: false, avail: false, msg: TEMPLATES['New job (Hindi)'] };
  const f = st.bulk; const list = await bulkAudience();
  const { data: hist } = await sb.from('broadcasts').select('*').order('created_at', { ascending: false }).limit(8);
  M.innerHTML = `<h1 style="margin:0 0 4px">📣 Bulk WhatsApp</h1><div class="note" style="margin-bottom:14px">Choose who gets it, write the message, then send. <b>{name}</b> becomes each person's first name.</div>
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
  <section class="card" style="margin:0"><b>1 · Who gets it</b>
    <div class="filters" style="margin-top:10px"><select class="inp" id="bc">${cityOpts(f.city, 'City: All')}</select><select class="inp" id="br"><option value="">Role: All</option>${['Caregiver', 'Nurse', 'Physio'].map((r) => `<option ${f.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select><select class="inp" id="bs"><option value="">Stage: All</option>${['New', 'Contacted', 'Docs pending', 'In verification', 'Verified', 'Placed', 'Dormant'].map((x) => `<option ${f.stage === x ? 'selected' : ''}>${x}</option>`).join('')}</select><select class="inp" id="bst"><option value="">YORO staff + others</option><option value="yes" ${f.staff === 'yes' ? 'selected' : ''}>Only YORO staff</option><option value="no" ${f.staff === 'no' ? 'selected' : ''}>Exclude YORO staff</option></select><button class="chip ${f.verified ? 'on' : ''}" id="bv">Verified only</button><button class="chip ${f.avail ? 'on' : ''}" id="ba">Available only</button></div>
    <div style="font-size:22px;font-weight:700;color:#0F766E">${list.length} <span style="font-size:14px;font-weight:600;color:#5B6565">people</span></div>
    <div class="note" style="margin-top:4px;max-height:150px;overflow:auto">${list.slice(0, 60).map((c) => `${esc(c.name)}${c.is_yoro_staff ? ' (staff)' : ''} · ${esc(c.phone)} · ${esc(c.city)}`).join('<br>') || 'Nobody matches these filters.'}${list.length > 60 ? `<br>…and ${list.length - 60} more` : ''}</div>
  </section>
  <section class="card" style="margin:0"><b>2 · Message</b>
    <div class="chips" style="margin:10px 0">${Object.keys(TEMPLATES).map((k) => `<button class="chip" data-tpl="${esc(k)}" style="font-size:12px;padding:6px 10px">${esc(k)}</button>`).join('')}</div>
    <textarea class="inp" id="bmsg" rows="8">${esc(f.msg)}</textarea>
    <div class="note" style="margin-top:6px">Preview for ${esc(list[0]?.name || 'first person')}:</div><div id="bprev" style="white-space:pre-wrap;background:#E7F8EE;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:4px">${esc(personalize(f.msg, list[0] || { name: 'Sunita' }))}</div>
  </section></div>
  <section class="card" style="margin-top:16px"><b>3 · Send</b>
    <div class="row" style="flex-wrap:wrap;margin-top:10px;gap:10px">
      <button class="btn sm" id="bstart" ${list.length ? '' : 'disabled'}>▶ Send to all ${list.length} (one tap each)</button>
      <button class="btn sm ghost" id="bcopy" ${list.length ? '' : 'disabled'}>📋 Copy all numbers</button>
      <button class="btn sm ghost" id="bcsv" ${list.length ? '' : 'disabled'}>⬇ Contacts CSV</button>
    </div>
    <div class="note" style="margin-top:10px;line-height:1.6"><b>▶ Send to all</b> opens WhatsApp with the message already typed for each person. Press send in WhatsApp, come back, tap the next name. About 5 seconds per person.<br><b>📋 Copy all numbers / ⬇ CSV</b> are for a WhatsApp Business <i>broadcast list</i> (max 256 people per list; only people who have saved 92725 71708 in their phone receive broadcasts).<br><b>True one-click send to everyone</b> needs the WhatsApp Business API (Gupshup / Interakt / Meta). Once you have an account, it plugs in here.</div>
    <div id="bqueue"></div>
  </section>
  <h2 style="margin-top:18px">Recent sends</h2>${(hist || []).map((h) => `<div class="card" style="padding:10px 14px"><div class="row" style="justify-content:space-between"><b style="font-size:13px">${esc(h.message.split('\n')[0].slice(0, 70))}</b><span class="note">${new Date(h.created_at).toLocaleString('en-IN')} · ${esc(h.created_by || '')}</span></div><div class="note">${h.sent_count} of ${h.recipient_count} sent · ${esc(Object.entries(h.filters || {}).filter(([, v]) => v).map(([k, v]) => k + ': ' + v).join(', ') || 'everyone')}</div></div>`).join('') || '<div class="note">No bulk sends yet.</div>'}`;
  const refresh = () => bulk();
  $('bc').onchange = (e) => { f.city = e.target.value; refresh(); }; $('br').onchange = (e) => { f.role = e.target.value; refresh(); }; $('bs').onchange = (e) => { f.stage = e.target.value; refresh(); }; $('bst').onchange = (e) => { f.staff = e.target.value; refresh(); };
  $('bv').onclick = () => { f.verified = !f.verified; refresh(); }; $('ba').onclick = () => { f.avail = !f.avail; refresh(); };
  $('bmsg').oninput = (e) => { f.msg = e.target.value; $('bprev').textContent = personalize(f.msg, list[0] || { name: 'Sunita' }); };
  M.querySelectorAll('[data-tpl]').forEach((b) => (b.onclick = () => { f.msg = TEMPLATES[b.dataset.tpl]; $('bmsg').value = f.msg; $('bprev').textContent = personalize(f.msg, list[0] || { name: 'Sunita' }); }));
  $('bcopy').onclick = async () => { const txt = list.map((c) => '+91' + c.phone).join('\n'); try { await navigator.clipboard.writeText(txt); toast(`Copied ${list.length} numbers`); } catch (e) { openSheet(`<h2>${list.length} numbers</h2><textarea class="inp" rows="14">${txt}</textarea><button class="btn" id="closeSheet" style="margin-top:10px">Close</button>`); $('closeSheet').onclick = closeSheet; } };
  $('bcsv').onclick = () => { const lines = ['Name,Phone,City,Role'].concat(list.map((c) => [c.name, '+91' + c.phone, c.city, c.role].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'yoro-whatsapp-contacts.csv'; a.click(); };
  $('bstart').onclick = async () => {
    if (!f.msg.trim()) return toast('Write a message first');
    const filters = { city: f.city, role: f.role, stage: f.stage, staff: f.staff, verified: f.verified ? 'yes' : '', available: f.avail ? 'yes' : '' };
    const { data: log } = await sb.from('broadcasts').insert({ message: f.msg, filters, recipient_count: list.length, created_by: user.email }).select('id').single();
    bulkQ = { list, i: 0, msg: f.msg, logId: log?.id || null }; drawQueue();
  };
}
function drawQueue() {
  const q = bulkQ, box = $('bqueue'); if (!box) return;
  if (q.i >= q.list.length) { box.innerHTML = `<div class="card" style="margin-top:12px;border:2px solid #15803D"><b style="color:#15803D">✓ Done — ${q.list.length} people</b></div>`; if (q.logId) sb.from('broadcasts').update({ sent_count: q.i }).eq('id', q.logId); return; }
  const c = q.list[q.i];
  box.innerHTML = `<div class="card" style="margin-top:12px;border:2px solid #0F766E"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><div class="note">${q.i + 1} of ${q.list.length}</div><b style="font-size:16px">${esc(c.name)}</b> <span class="note">· +91 ${esc(c.phone)} · ${esc(c.city)}</span></div><div class="row"><a class="btn sm" id="qsend" href="${waLink(c, q.msg)}" target="_blank" rel="noopener" style="background:#25D366">Open WhatsApp → ${esc(c.name.split(' ')[0])}</a><button class="btn sm ghost" id="qskip">Skip</button><button class="btn sm danger" id="qstop">Stop</button></div></div><div class="bar" style="margin-top:10px"><i style="width:${Math.round((q.i / q.list.length) * 100)}%"></i></div></div>`;
  $('qsend').onclick = () => { setTimeout(() => { q.i++; if (q.logId && (q.i % 5 === 0)) sb.from('broadcasts').update({ sent_count: q.i }).eq('id', q.logId); drawQueue(); }, 300); };
  $('qskip').onclick = () => { q.list.splice(q.i, 1); drawQueue(); };
  $('qstop').onclick = async () => { const sent = q.i; if (q.logId) await sb.from('broadcasts').update({ sent_count: sent }).eq('id', q.logId); q.list = []; q.i = 0; box.innerHTML = `<div class="note" style="margin-top:10px">Stopped after ${sent} sends.</div>`; };
}

// ---------- verification queue ----------
async function queue() {
  const { data: rows } = await sb.from('documents').select('*, candidates(id,name,phone,role,area,stage)').eq('status', 'Uploaded').order('created_at', { ascending: true }).limit(100);
  M.innerHTML = `<h1>Verification queue</h1><div class="note" style="margin-bottom:12px">Documents waiting for review, oldest first. Open the candidate to view, verify or reject.</div>${(rows || []).map((d) => `<div class="card row"><div class="grow"><b>${esc(d.candidates?.name || '')}</b> <span class="note">· ${esc(d.candidates?.role || '')} · ${esc(d.candidates?.area || '')} · ${esc(d.candidates?.phone || '')}</span><div class="note">${esc(d.slot)} · ${esc(d.file_name || '')} · uploaded ${new Date(d.created_at).toLocaleString('en-IN')}</div></div><button class="btn sm" data-cand="${d.candidate_id}">Review</button></div>`).join('') || '<div class="card note" style="text-align:center;padding:30px">Queue is empty 🎉</div>'}`;
}
</script>
